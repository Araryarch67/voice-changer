name: Voice Changer Mic driver

# Builds the Windows virtual microphone driver and keeps the CAB that Microsoft's
# attestation signing takes. Signing itself happens in Partner Center; see
# native-rust/platforms/windows/driver/README.md.
on:
  push:
    paths:
      - "native-rust/platforms/windows/driver/**"
      - ".github/workflows/driver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: native-rust/platforms/windows/driver
    steps:
      - uses: actions/checkout@v4

      - name: Add the driver toolset and Spectre-mitigated libraries
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -property installationPath
          $arguments = "modify --installPath `"$vs`" --add Component.Microsoft.Windows.DriverKit --add Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre --quiet --norestart"
          $setup = Start-Process "$installer\setup.exe" -ArgumentList $arguments -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Visual Studio installer failed ($($setup.ExitCode))" }

      - name: Install the WDK 10.0.26100
        run: |
          $wdk = "$env:RUNNER_TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe' -OutFile $wdk
          $setup = Start-Process $wdk -ArgumentList '/features + /quiet /norestart' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "WDK installer failed ($($setup.ExitCode))" }

      - name: Build, verify and pack
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: voice-changer-mic-driver
          path: native-rust/platforms/windows/driver/dist/
          if-no-files-found: error

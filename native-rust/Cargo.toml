[package]
name = "voice-changer-native"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Native Rust and egui real-time RVC voice changer"

[lib]
# Not the program's name: on Windows both would write voice_changer_native.pdb.
name = "voice_changer"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["gui", "audio", "onnx", "export", "world", "catalog"]
# Harvest and DIO pitch detection through the WORLD vocoder (C++, built with cc).
world = ["dep:rsworld", "dep:rsworld-sys"]
export = ["dep:zip"]
gui = ["dep:eframe", "dep:wgpu", "dep:rfd", "dep:image"]
audio = ["dep:cpal", "dep:crossbeam-queue"]
onnx = ["dep:ort", "ort/load-dynamic", "ort/cuda"]
onnx-static = ["dep:ort"]
android = ["gui", "audio", "eframe/android-native-activity"]
# Search and download voices from voice-models.com.
catalog = ["dep:ureq", "dep:sha2", "export"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
nnnoiseless = { version = "0.5", default-features = false }
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "persistence"], optional = true }
wgpu = { version = "25", default-features = false, features = ["vulkan", "gles", "metal", "dx12", "wgsl"], optional = true }
cpal = { version = "=0.18.2", optional = true }
crossbeam-queue = { version = "0.3", optional = true }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
miniz_oxide = "0.8"
rsworld = { version = "0.1", optional = true }
rsworld-sys = { version = "0.1", optional = true }
aec3 = "0.4"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
ureq = { version = "2", optional = true }
# Checks downloaded models against their published SHA-256.
sha2 = { version = "0.10", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "=0.16.0", optional = true }

[target.'cfg(windows)'.dependencies]
# Reads VB-Cable's buffer setting and opens its control panel.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3", features = ["AVAudioSession", "AVAudioSessionTypes", "block2"] }
block2 = "0.6"
objc2 = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[package.metadata.android]
package = "dev.voicechanger.nativeapp"
apk_name = "voice-changer"
build_targets = ["aarch64-linux-android"]
runtime_libs = "platforms/android/runtime-libs"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[package.metadata.android.application]
label = "Voice Changer"
debuggable = false

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize"

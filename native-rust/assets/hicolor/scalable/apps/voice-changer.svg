<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Voice Changer app icon: a voice waveform that shifts colour as it is transformed. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B72D6"/>
      <stop offset="0.55" stop-color="#5B3FA8"/>
      <stop offset="1" stop-color="#2E1F5E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="168" y1="0" x2="856" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EADDFF"/>
      <stop offset="0.5" stop-color="#F4D9FF"/>
      <stop offset="1" stop-color="#FFB1C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1A0F3D" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>
  <rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"/>
  <g fill="url(#wave)" filter="url(#shadow)">
    <rect x="160" y="412" width="68" height="200" rx="34"/>
    <rect x="266" y="332" width="68" height="360" rx="34"/>
    <rect x="372" y="242" width="68" height="540" rx="34"/>
    <rect x="478" y="182" width="68" height="660" rx="34"/>
    <rect x="584" y="272" width="68" height="480" rx="34"/>
    <rect x="690" y="352" width="68" height="320" rx="34"/>
    <rect x="796" y="422" width="68" height="180" rx="34"/>
  </g>
</svg>

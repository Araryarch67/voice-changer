<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Small-size variant of icon.svg (16-32 px): fewer, thicker bars on a fuller tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B72D6"/>
      <stop offset="0.55" stop-color="#5B3FA8"/>
      <stop offset="1" stop-color="#2E1F5E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="168" y1="0" x2="856" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EADDFF"/>
      <stop offset="0.5" stop-color="#F4D9FF"/>
      <stop offset="1" stop-color="#FFB1C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1A0F3D" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="224" fill="url(#tile)"/>
  <rect x="16" y="16" width="992" height="992" rx="224" fill="url(#glow)"/>
    <g fill="url(#wave)">
    <rect x="84" y="362" width="120" height="300" rx="60"/>
    <rect x="268" y="232" width="120" height="560" rx="60"/>
    <rect x="452" y="132" width="120" height="760" rx="60"/>
    <rect x="636" y="252" width="120" height="520" rx="60"/>
    <rect x="820" y="372" width="120" height="280" rx="60"/>
  </g>
</svg>
